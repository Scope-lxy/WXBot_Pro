<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380">
  <defs>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #16324f; }
      .subtitle { font: 400 14px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #58708a; }
      .section { font: 700 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #16324f; }
      .label { font: 600 15px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #17324d; }
      .small { font: 400 13px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #3e5b77; }
      .decision { font: 600 14px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #17324d; text-anchor: middle; }
      .yesno { font: 700 12px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #42617f; }
      .card-blue { fill: #eef6ff; stroke: #4b89c8; stroke-width: 2; rx: 18; ry: 18; }
      .card-green { fill: #eefaf3; stroke: #4f9a6d; stroke-width: 2; rx: 18; ry: 18; }
      .card-gold { fill: #fff8e9; stroke: #c99a3a; stroke-width: 2; rx: 18; ry: 18; }
      .card-rose { fill: #fff1f1; stroke: #c77979; stroke-width: 2; rx: 18; ry: 18; }
      .decision-shape { fill: #ffffff; stroke: #6f8aa6; stroke-width: 2; }
      .arrow { stroke: #5d7893; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #8aa1b8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .note { fill: #f7fbff; stroke: #b9d4ef; stroke-width: 1.5; rx: 14; ry: 14; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d7893"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1380" fill="#fbfdff"/>
  <text x="60" y="58" class="title">WXBot Pro 当前版本消息处理流程图</text>
  <text x="60" y="88" class="subtitle">基于当前代码整理：先按消息属性分流，再进入管理员输入、素材来源、自定义转发、AI 回复等链路。</text>

  <rect x="60" y="130" width="290" height="76" class="card-blue"/>
  <text x="205" y="165" text-anchor="middle" class="label">微信监听子窗口收到消息</text>
  <text x="205" y="190" text-anchor="middle" class="small">入口来自 wxautox 监听回调</text>

  <rect x="60" y="258" width="290" height="92" class="card-blue"/>
  <text x="205" y="295" text-anchor="middle" class="label">message_handle_callback(msg, chat)</text>
  <text x="205" y="320" text-anchor="middle" class="small">统一入口：记日志、兜底异常、决定后续分支</text>

  <polygon points="205,400 315,470 205,540 95,470" class="decision-shape"/>
  <text x="205" y="460" class="decision">消息属性</text>
  <text x="205" y="482" class="decision">attr 是什么？</text>

  <rect x="530" y="150" width="350" height="118" class="card-green"/>
  <text x="705" y="186" text-anchor="middle" class="label">friend：私聊来消息</text>
  <text x="705" y="214" text-anchor="middle" class="small">进入 handle_friend_message_callback</text>
  <text x="705" y="238" text-anchor="middle" class="small">图片下载、语音转文字、收消息计数、更新时间</text>

  <polygon points="735,332 850,404 735,476 620,404" class="decision-shape"/>
  <text x="735" y="397" class="decision">管理员输入态</text>
  <text x="735" y="419" class="decision">或素材来源消息？</text>

  <rect x="1000" y="144" width="350" height="100" class="card-gold"/>
  <text x="1175" y="182" text-anchor="middle" class="label">system：系统消息</text>
  <text x="1175" y="210" text-anchor="middle" class="small">已配置群聊时，可能触发群欢迎语</text>

  <rect x="1000" y="300" width="350" height="122" class="card-rose"/>
  <text x="1175" y="338" text-anchor="middle" class="label">self：自己账号同步出来的消息</text>
  <text x="1175" y="366" text-anchor="middle" class="small">管理员窗口下：可当成命令、发圈输入、转发输入</text>
  <text x="1175" y="392" text-anchor="middle" class="small">非管理员窗口：仍可能被当成素材来源消息</text>

  <rect x="430" y="560" width="240" height="100" class="card-gold"/>
  <text x="550" y="598" text-anchor="middle" class="label">管理员前台输入</text>
  <text x="550" y="626" text-anchor="middle" class="small">转发输入 / 发圈输入命中后</text>
  <text x="550" y="648" text-anchor="middle" class="small">本条消息直接消费，不再走 AI</text>

  <rect x="770" y="560" width="240" height="100" class="card-green"/>
  <text x="890" y="598" text-anchor="middle" class="label">素材来源消息</text>
  <text x="890" y="626" text-anchor="middle" class="small">进入素材池或素材运行时</text>
  <text x="890" y="648" text-anchor="middle" class="small">通常到这里就结束</text>

  <rect x="1090" y="560" width="240" height="100" class="card-blue"/>
  <text x="1210" y="598" text-anchor="middle" class="label">进入 process_message</text>
  <text x="1210" y="626" text-anchor="middle" class="small">正式决定：跳过 / 命令 / 关键词 / AI</text>
  <text x="1210" y="648" text-anchor="middle" class="small">这是主消息分发器</text>

  <polygon points="1210,680 1320,752 1210,824 1100,752" class="decision-shape"/>
  <text x="1210" y="744" class="decision">route_process_message</text>
  <text x="1210" y="766" class="decision">识别聊天类型和开关</text>

  <rect x="920" y="900" width="210" height="92" class="card-gold"/>
  <text x="1025" y="937" text-anchor="middle" class="label">skip</text>
  <text x="1025" y="964" text-anchor="middle" class="small">不在监听范围</text>
  <text x="1025" y="986" text-anchor="middle" class="small">或被暂停 / 只监听</text>

  <rect x="1175" y="900" width="210" height="92" class="card-blue"/>
  <text x="1280" y="937" text-anchor="middle" class="label">admin_command</text>
  <text x="1280" y="964" text-anchor="middle" class="small">管理员命令</text>
  <text x="1280" y="986" text-anchor="middle" class="small">如监听增删、接管等</text>

  <rect x="1160" y="1050" width="230" height="104" class="card-green"/>
  <text x="1275" y="1087" text-anchor="middle" class="label">group_keyword_reply / group_ai</text>
  <text x="1275" y="1115" text-anchor="middle" class="small">群关键词优先，其次判断 @ 机器人</text>
  <text x="1275" y="1139" text-anchor="middle" class="small">群只监听时直接跳过 AI</text>

  <rect x="900" y="1050" width="230" height="104" class="card-blue"/>
  <text x="1015" y="1087" text-anchor="middle" class="label">takeover_mirror</text>
  <text x="1015" y="1115" text-anchor="middle" class="small">单聊被人工接管时</text>
  <text x="1015" y="1139" text-anchor="middle" class="small">消息转镜像到管理员</text>

  <rect x="665" y="890" width="210" height="250" class="card-blue"/>
  <text x="770" y="925" text-anchor="middle" class="label">private_ai / wx_send_ai</text>
  <text x="770" y="955" text-anchor="middle" class="small">1. 关键词回复优先</text>
  <text x="770" y="981" text-anchor="middle" class="small">2. 取会话记忆上下文</text>
  <text x="770" y="1007" text-anchor="middle" class="small">3. 图片理解 / 语音回复判断</text>
  <text x="770" y="1033" text-anchor="middle" class="small">4. 调用模型生成回复</text>
  <text x="770" y="1059" text-anchor="middle" class="small">5. 发送前确认目标子窗口</text>
  <text x="770" y="1085" text-anchor="middle" class="small">6. 成功后写入统计与记忆状态</text>
  <text x="770" y="1117" text-anchor="middle" class="small">目标：宁可延后，也尽量避免回错人</text>

  <rect x="60" y="1245" width="1480" height="86" class="note"/>
  <text x="90" y="1281" class="label">当前版本的产品侧结论</text>
  <text x="90" y="1307" class="small">消息不是直接“一股脑扔给 AI”，而是先判断是不是管理员输入、素材来源、自定义转发、人工接管、群关键词，再决定要不要进入 AI 回复。</text>

  <path d="M205 206 L205 258" class="arrow"/>
  <path d="M205 350 L205 400" class="arrow"/>

  <path d="M315 470 L530 210" class="arrow"/>
  <text x="388" y="312" class="yesno">friend</text>

  <path d="M315 500 L1000 350" class="arrow"/>
  <text x="641" y="428" class="yesno">self</text>

  <path d="M245 540 L1040 244" class="arrow"/>
  <text x="624" y="372" class="yesno">system</text>

  <path d="M705 268 L705 320 L735 320 L735 332" class="arrow"/>
  <path d="M650 440 L585 560" class="arrow"/>
  <text x="505" y="495" class="yesno">管理员输入命中</text>

  <path d="M735 476 L850 560" class="arrow"/>
  <text x="805" y="520" class="yesno">素材来源命中</text>

  <path d="M810 440 L980 440 L980 530 L1090 530" class="arrow"/>
  <text x="930" y="485" class="yesno">其余情况</text>

  <path d="M1175 422 L1210 560" class="arrow-soft"/>
  <text x="1194" y="500" class="yesno">管理员窗口下</text>

  <path d="M1210 660 L1210 680" class="arrow"/>

  <path d="M1135 752 L1030 900" class="arrow"/>
  <text x="1068" y="850" class="yesno">skip</text>

  <path d="M1210 824 L1280 900" class="arrow"/>
  <text x="1242" y="872" class="yesno">管理员</text>

  <path d="M1285 788 L1275 1050" class="arrow"/>
  <text x="1305" y="930" class="yesno">群聊</text>

  <path d="M1140 788 L820 890" class="arrow"/>
  <text x="930" y="848" class="yesno">普通私聊</text>

  <path d="M550 660 L550 710 L1070 710 L1070 560" class="arrow-soft"/>
  <path d="M890 660 L890 700 L1090 700 L1090 560" class="arrow-soft"/>
</svg>
